name: Refine access type layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-access-type-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup
        run: cp index.html backups/index_pre_refino_tipo_acesso_2026-09-03.html
      - name: Aplicar refino
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div><label>Tipo de acesso</label><select id="aTipo"><option value="Visitante">Visitante</option><option value="Prestador">Prestador</option></select></div><div><label>Empresa</label><input id="aEmpresa"></div>'
          new='<div class="accessTypeCompanyRow"><div><label>Tipo de acesso</label><select id="aTipo"><option value="Visitante">Visitante</option><option value="Prestador">Prestador</option></select></div><div><label>Empresa</label><input id="aEmpresa"></div></div>'
          if s.count(old)!=1: raise SystemExit('bloco Tipo/Empresa divergente')
          s=s.replace(old,new,1)
          css='''\n/* v152 — refino do cadastro: Tipo de acesso + Empresa em linha 50/50 */\n.accessLine.sheetModel .accessTypeCompanyRow{\n  grid-column:1/-1;\n  display:grid;\n  grid-template-columns:minmax(0,1fr) minmax(0,1fr);\n  gap:16px;\n  align-items:end;\n}\n.accessLine.sheetModel .accessTypeCompanyRow>div{min-width:0}\n@media(max-width:760px){\n  .accessLine.sheetModel .accessTypeCompanyRow{grid-template-columns:1fr;gap:8px}\n}\n'''
          marker='</style>\n<style>\n/* Auth 2.0 fase 1'
          if marker not in s: raise SystemExit('marcador CSS seguro ausente')
          s=s.replace(marker,css+'</style>\n<style>\n/* Auth 2.0 fase 1',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'class="accessTypeCompanyRow"' index.html
          grep -q 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' index.html
          grep -q 'id="aTipo"' index.html
          grep -q 'id="aEmpresa"' index.html
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_refino_tipo_acesso_2026-09-03.html
          git commit -m "refactor: equilibrar tipo de acesso e empresa no formulario"
          git push origin main

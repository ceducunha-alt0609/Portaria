name: Inspect auth regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-auth-regression.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['function repairLocalUserPasswords','function mergeUsersPreservingPasswords','state.users=','remoteUsers','function applyBackupData','function cloud','function restore','function login','senha']
          out=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  out.append(f'### {needle} @ {i}\n'+s[max(0,i-1800):i+7000]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_regressao_login_2026-09-04.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_regressao_login_2026-09-04.txt
          git commit -m "chore: registrar diagnostico da regressao de login"
          git push origin main

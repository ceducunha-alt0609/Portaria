name: Theme local preference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-local-preference.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_tema_local_2026-09-04.html
          cp sw.js backups/sw_pre_tema_local_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/theme_local_preference.py
      - name: Validar
        run: |
          grep -q "LOCAL_THEME_KEY='pp_local_theme_v1'" index.html
          grep -q 'function getLocalThemeMode' index.html
          grep -q 'Tema salvo neste dispositivo' index.html
          grep -q 'portaria-primavera-v1-0-18' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_tema_local_2026-09-04.html backups/sw_pre_tema_local_2026-09-04.js
          git commit -m "fix: manter tema local por dispositivo"
          git push origin main

name: Inspect access renders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-access-renders.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for name in ['function renderAccess(){','function renderAccessHistory(){','function openAccessHistory(){']:
              i=s.find(name)
              print('\n===== '+name+' =====')
              print(s[i:i+7000] if i>=0 else 'NAO ENCONTRADO')
          PY

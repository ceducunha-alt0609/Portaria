name: Improve recovery cooldown
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-recovery-cooldown.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_recovery_cooldown_2026-09-03.html
          cp sw.js backups/sw_pre_recovery_cooldown_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/improve_recovery_cooldown.py
      - name: Validar
        run: |
          grep -q 'recoveryContinueBtn' index.html
          grep -q 'startRecoveryCooldown' index.html
          grep -q 'portaria-primavera-v1-0-10' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_recovery_cooldown_2026-09-03.html backups/sw_pre_recovery_cooldown_2026-09-03.js
          git commit -m "feat: adicionar contador na recuperacao por email"
          git push origin main

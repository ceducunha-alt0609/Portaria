name: Inspect access order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-access-order.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['function renderAccesses','function accessCards','accessQuickFilter','state.accesses.filter','sort(']
          out=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  out.append(f'### {needle} @ {i}\n'+s[max(0,i-1800):i+5000]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_ordem_acessos_2026-09-04.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_ordem_acessos_2026-09-04.txt
          git commit -m "chore: registrar diagnostico da ordenacao de acessos"
          git push origin main

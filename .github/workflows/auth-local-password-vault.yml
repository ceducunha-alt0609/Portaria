name: Auth local password vault
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-local-password-vault.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_cofre_senhas_2026-09-04.html
          cp sw.js backups/sw_pre_cofre_senhas_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/auth_local_password_vault.py
      - name: Validar
        run: |
          grep -q "LOCAL_USER_PASSWORDS_KEY='pp_local_user_passwords_v1'" index.html
          grep -q 'function rememberLocalUserPasswords' index.html
          grep -q 'const vault=getLocalUserPasswordVault()' index.html
          grep -q 'portaria-primavera-v1-0-17' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_cofre_senhas_2026-09-04.html backups/sw_pre_cofre_senhas_2026-09-04.js
          git commit -m "fix: preservar senhas locais apos atualizacao e sync"
          git push origin main

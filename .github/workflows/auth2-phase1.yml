name: Auth 2 phase 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth2-phase1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          mkdir -p backups
          cp index.html backups/index_pre_auth2_phase1_2026-09-03.html
          cp sw.js backups/sw_pre_auth2_phase1_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/auth2_phase1.py
      - name: Validar
        run: |
          grep -q 'loginRecoverBtn' index.html
          grep -q 'passwordRecoveryModal' index.html
          grep -q 'id="uEmail"' index.html
          grep -q 'function requestPasswordRecovery()' index.html
          grep -q 'portaria-primavera-v1-0-6' sw.js
          grep -q 'Consultar histórico de acessos' index.html
          grep -q 'mobileHistoryShortcut' index.html
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_auth2_phase1_2026-09-03.html backups/sw_pre_auth2_phase1_2026-09-03.js
          git rm .github/scripts/auth2_phase1.py .github/workflows/auth2-phase1.yml .github/scripts/auth2_audit.py .github/workflows/auth2-audit.yml .github/auth2_audit.txt || true
          git commit -m "feat: preparar recuperacao de senha por email"
          git push origin main

name: Add access history
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-access-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar
        run: |
          mkdir -p backups
          cp index.html backups/index_pre_access_history_2026-09-03.html
          python .github/scripts/add-access-history.py
      - name: Validar
        run: |
          test -s backups/index_pre_access_history_2026-09-03.html
          grep -q "function openAccessHistory" index.html
          grep -q "Histórico de acessos" index.html
          grep -q "histAccessFrom" index.html
      - name: Gravar
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_access_history_2026-09-03.html
          git rm .github/workflows/add-access-history.yml .github/scripts/add-access-history.py
          git commit -m "feat: adicionar historico pesquisavel de acessos"
          git push origin main

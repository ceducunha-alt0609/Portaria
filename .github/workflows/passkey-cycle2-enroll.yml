name: Passkey cycle 2 enroll
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/passkey-cycle2-enroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_passkey_cycle2_2026-09-03.html
          cp sw.js backups/sw_pre_passkey_cycle2_2026-09-03.js
          cp passkey-auth.js backups/passkey-auth_pre_cycle2_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/passkey_cycle2_enroll.py
      - name: Validar
        run: |
          grep -q 'uPasskeyBox' index.html
          grep -q 'passkeyEnrollModal' index.html
          grep -q 'registerPasskey()' index.html
          grep -q 'portaria-primavera-v1-0-12' sw.js
          grep -q "'./passkey-auth.js'" sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_passkey_cycle2_2026-09-03.html backups/sw_pre_passkey_cycle2_2026-09-03.js backups/passkey-auth_pre_cycle2_2026-09-03.js
          git commit -m "feat: habilitar cadastro de biometria e passkey"
          git push origin main

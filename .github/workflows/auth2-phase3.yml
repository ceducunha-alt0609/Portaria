name: Auth 2 phase 3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth2-phase3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_auth2_phase3_2026-09-03.html
          cp sw.js backups/sw_pre_auth2_phase3_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/auth2_phase3.py
      - name: Validar
        run: |
          grep -q 'passwordResetModal' index.html
          grep -q 'PASSWORD_RECOVERY' index.html
          grep -q 'APP_PUBLIC_URL' index.html
          grep -q 'portaria-primavera-v1-0-8' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_auth2_phase3_2026-09-03.html backups/sw_pre_auth2_phase3_2026-09-03.js
          git commit -m "feat: concluir recuperacao de senha por email"
          git push origin main

name: Patch Drive v151 index

on:
  push:
    branches:
      - drive-oauth-v151
    paths:
      - .github/workflows/patch-drive-v151-index.yml
      - gdrive-oauth-v151.js
      - gdrive-adapter-v151.js
      - gdrive-oauth-bridge-v151.html

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: drive-oauth-v151
          fetch-depth: 0

      - name: Insert Drive v151 loaders only once
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          oauth = '<script src="./gdrive-oauth-v151.js?v=151"></script>'
          adapter = '<script src="./gdrive-adapter-v151.js?v=151"></script>'
          marker = '<!-- Drive OAuth v151 loader -->'
          if marker in text:
              print('Drive v151 loader already present; nothing to change.')
          else:
              pos = text.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing </body> not found')
              block = f'\n{marker}\n{oauth}\n{adapter}\n'
              text = text[:pos] + block + text[pos:]
              p.write_text(text, encoding='utf-8')
              print('Inserted Drive v151 loader before final </body>.')

      - name: Verify surgical diff
        run: |
          git diff --check
          git diff -- index.html
          CHANGED=$(git diff --numstat -- index.html | awk '{print $1+$2}')
          test "${CHANGED:-0}" -le 4
          grep -F '<script src="./gdrive-oauth-v151.js?v=151"></script>' index.html
          grep -F '<script src="./gdrive-adapter-v151.js?v=151"></script>' index.html

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(drive-v151): carregar OAuth e adapter no index'
          git push origin HEAD:drive-oauth-v151

name: Rollback passkey cycle 2 safe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-passkey-cycle2-safe.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar
        run: python .github/scripts/rollback_passkey_cycle2.py
      - name: Validar
        run: |
          grep -q 'loginPasskeyBtn' index.html
          grep -q 'portariaCompletePasskeyLogin' index.html
          if grep -q 'uPasskeyBox' index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_cycle2_problematico_2026-09-03.html
          git commit -m "fix: remover ciclo 2 passkey apos travamento no splash"
          git push origin main

name: Inspect access csv function
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-access-csv-function.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('function exportAccessesCsv(){')
          j=s.find('\nfunction ',i+10)
          if i<0: raise SystemExit('funcao nao encontrada')
          if j<0: j=i+5000
          Path('backups/diagnostico_export_access_csv_2026-09-03.txt').write_text(s[i:j],encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_export_access_csv_2026-09-03.txt
          git commit -m "chore: registrar diagnostico da exportacao de acessos"
          git push origin main

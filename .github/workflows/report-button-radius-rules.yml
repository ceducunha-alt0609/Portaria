name: Report button radius rules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-button-radius-rules.yml'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for block in s.split('}'):
              low=block.lower()
              if 'button' in low and 'border-radius' in low:
                  out.append(block.strip()+'}')
          Path('backups/diagnostico_button_radius_2026-09-03.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_button_radius_2026-09-03.txt
          git commit -m "chore: registrar regras de raio dos botoes"
          git push origin main

name: Rollback all passkey
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-all-passkey.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar index pré-passkey
        run: python .github/scripts/rollback_all_passkey.py
      - name: Validar Auth 2.0 e ausência de passkey
        run: |
          grep -q 'passwordRecoveryModal' index.html
          grep -q 'recoveryContinueBtn' index.html
          grep -q 'requestPasswordRecovery' index.html
          if grep -q 'loginPasskeyBtn' index.html; then exit 1; fi
          if grep -q 'portariaCompletePasskeyLogin' index.html; then exit 1; fi
          if grep -q 'registerPasskey()' index.html; then exit 1; fi
          if grep -q 'uPasskeyBox' index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_passkey_problematico_final_2026-09-03.html
          git commit -m "fix: restaurar versao estavel anterior a passkeys"
          git push origin main

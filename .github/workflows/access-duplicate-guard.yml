name: Access duplicate guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-duplicate-guard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_alerta_acesso_duplicado_2026-09-03.html
          cp sw.js backups/sw_pre_alerta_acesso_duplicado_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/access_duplicate_guard.py
      - name: Validar
        run: |
          grep -q 'function findActiveDuplicateAccess' index.html
          grep -q 'Acesso já em andamento' index.html
          grep -q 'Registrar mesmo' index.html
          grep -q 'portaria-primavera-v1-0-15' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_alerta_acesso_duplicado_2026-09-03.html backups/sw_pre_alerta_acesso_duplicado_2026-09-03.js
          git commit -m "feat: alertar sobre acesso duplicado em andamento"
          git push origin main

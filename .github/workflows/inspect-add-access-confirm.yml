name: Inspect add access confirm
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-add-access-confirm.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for needle in ['function addAccess(){','function openAppConfirm','openAppConfirm({']:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  out.append(f'### {needle} @ {i}\n'+s[max(0,i-1200):i+5000]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_add_access_confirm_2026-09-03.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_add_access_confirm_2026-09-03.txt
          git commit -m "chore: registrar diagnostico de acesso duplicado"
          git push origin main

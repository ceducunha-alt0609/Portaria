name: Access quick filter cycle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-quick-filter-cycle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index.html backups/index_pre_filtro_rapido_acessos_2026-09-03.html
      - run: python .github/scripts/access_quick_filter_cycle.py
      - run: |
          grep -q 'id="accessQuickFilters"' index.html
          grep -q 'function setAccessQuickFilter' index.html
          grep -q 'accessCard-${accessTypeClass(a)}' index.html
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_filtro_rapido_acessos_2026-09-03.html
          git commit -m "feat: adicionar filtros rapidos no controle em andamento"
          git push origin main

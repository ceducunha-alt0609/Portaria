name: Inspect gdrive config
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gdrive-config.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['gdriveClientIdConfig','gdriveApiKeyConfig','saveGDriveIntegrationConfig','testGDriveIntegrationConfig','GDRIVE','google drive','localStorage.setItem','localStorage.getItem']
          out=[]
          seen=set()
          for needle in needles:
              start=0
              while True:
                  i=s.lower().find(needle.lower(),start)
                  if i<0: break
                  key=(needle.lower(),i)
                  if key not in seen:
                      seen.add(key)
                      out.append(f'### {needle} @ {i}\n'+s[max(0,i-2200):i+5200]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_gdrive_config_2026-09-03.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_gdrive_config_2026-09-03.txt
          git commit -m "chore: registrar diagnostico da configuracao google drive"
          git push origin main

name: Report access type cycle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-access-type-cycle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_relatorios_tipo_acesso_2026-09-03.html
          cp sw.js backups/sw_pre_relatorios_tipo_acesso_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/report_access_type_cycle.py
      - name: Validar
        run: |
          grep -q '<h3>Tipos de acesso</h3>' index.html
          grep -q "'Tipo de acesso','Empresa'" index.html
          grep -q 'portaria-primavera-v1-0-14' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_relatorios_tipo_acesso_2026-09-03.html backups/sw_pre_relatorios_tipo_acesso_2026-09-03.js
          git commit -m "feat: integrar tipo de acesso aos relatorios e CSV"
          git push origin main

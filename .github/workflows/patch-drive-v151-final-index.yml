name: Patch Drive v151 final index

on:
  push:
    branches:
      - drive-oauth-v151-final
    paths:
      - .github/workflows/patch-drive-v151-final-index.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drive-oauth-v151-final
          fetch-depth: 0

      - name: Insert Drive v151 loaders only once
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- Drive OAuth v151 loader -->'
          oauth = '<script src="./gdrive-oauth-v151.js?v=151"></script>'
          adapter = '<script src="./gdrive-adapter-v151.js?v=151"></script>'
          if marker not in text:
              pos = text.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Closing </body> not found')
              text = text[:pos] + f'\n{marker}\n{oauth}\n{adapter}\n' + text[pos:]
              p.write_text(text, encoding='utf-8')

      - name: Verify surgical diff
        run: |
          git diff --check
          git diff -- index.html
          CHANGED=$(git diff --numstat -- index.html | awk '{print $1+$2}')
          test "${CHANGED:-0}" -le 4
          grep -F '<script src="./gdrive-oauth-v151.js?v=151"></script>' index.html
          grep -F '<script src="./gdrive-adapter-v151.js?v=151"></script>' index.html

      - name: Commit index change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(drive-v151): carregar OAuth e adapter no index'
          git push origin HEAD:drive-oauth-v151-final

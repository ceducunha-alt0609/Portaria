name: Refine primary row live clock safe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-primary-row-live-clock-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index.html backups/index_pre_refino_linha_relogio_2026-09-03.html
      - run: python .github/scripts/refine_primary_row_live_clock.py
      - run: |
          grep -q 'class="accessPrimaryRow"' index.html
          grep -q 'function syncAccessClock(force=false)' index.html
          grep -q 'syncAccessClock(true);' index.html
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_refino_linha_relogio_2026-09-03.html
          git commit -m "fix: compactar linha principal e manter horario de acesso atualizado"
          git push origin main

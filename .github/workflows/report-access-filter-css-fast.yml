name: Report access filter css fast
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-access-filter-css-fast.yml'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          needle='accessQuickFilter'
          start=0
          n=0
          while True:
              i=s.find(needle,start)
              if i<0: break
              n+=1
              out.append(f'### OCCURRENCE {n} POS {i}\n'+s[max(0,i-500):i+1200]+'\n')
              start=i+len(needle)
          Path('backups/diagnostico_access_filter_css_fast_2026-09-03.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_access_filter_css_fast_2026-09-03.txt
          git commit -m "chore: registrar diagnostico rapido do css dos filtros"
          git push origin main

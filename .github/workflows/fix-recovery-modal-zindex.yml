name: Fix recovery modal zindex
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-recovery-modal-zindex.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_recovery_zindex_2026-09-03.html
          cp sw.js backups/sw_pre_recovery_zindex_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/fix_recovery_modal_zindex.py
      - name: Validar
        run: |
          grep -q '#passwordRecoveryModal,#passwordResetModal{z-index:1205!important}' index.html
          grep -q 'portaria-primavera-v1-0-9' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_recovery_zindex_2026-09-03.html backups/sw_pre_recovery_zindex_2026-09-03.js
          git commit -m "fix: exibir modal de recuperacao acima do login"
          git push origin main

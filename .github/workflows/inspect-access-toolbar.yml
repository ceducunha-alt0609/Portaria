name: Inspect access toolbar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-access-toolbar.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('id="accessSearch"')
          print(s[max(0,i-1800):i+2200] if i>=0 else 'NAO ENCONTRADO')
          PY

name: Passkey cycle 1 bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/passkey-cycle1-bridge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_passkey_cycle1_2026-09-03.html
          cp sw.js backups/sw_pre_passkey_cycle1_2026-09-03.js
      - name: Aplicar
        run: python .github/scripts/passkey_cycle1_bridge.py
      - name: Validar
        run: |
          grep -q '@supabase/supabase-js@2.105.0' index.html
          grep -q 'experimental:{passkey:true}' index.html
          grep -q 'loginPasskeyBtn' index.html
          grep -q 'portariaCompletePasskeyLogin' index.html
          grep -q 'passkey-auth.js' index.html
          grep -q 'portaria-primavera-v1-0-11' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_passkey_cycle1_2026-09-03.html backups/sw_pre_passkey_cycle1_2026-09-03.js
          git commit -m "feat: preparar entrada por biometria e passkey"
          git push origin main

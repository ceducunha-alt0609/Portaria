name: Inspect access resident link
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-access-resident-link.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['id="aAutorizado"','id="aDestino"','openUnit','selectUnit','aBloco','aApto','state.units','moradores']
          out=[]
          seen=set()
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  key=(needle,i)
                  if key not in seen:
                      seen.add(key)
                      out.append(f'### {needle} @ {i}\n'+s[max(0,i-1800):i+4200]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_vinculo_acesso_moradores_2026-09-03.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_vinculo_acesso_moradores_2026-09-03.txt
          git commit -m "chore: registrar diagnostico do vinculo acesso moradores"
          git push origin main

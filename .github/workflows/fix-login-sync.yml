name: Fix login sync
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-login-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Backup e correção
        shell: bash
        run: |
          set -e
          mkdir -p backups
          cp index.html backups/index_pre_fix_login_sync_2026-09-03.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_load="""    data.users=Array.isArray(data.users)&&data.users.length?data.users:defaultUsers();
    data.logs=Array.isArray(data.logs)?data.logs:[];"""
          new_load="""    data.users=Array.isArray(data.users)&&data.users.length?data.users:defaultUsers();
    // Recupera apenas credenciais padrão ausentes, mantendo senhas personalizadas já existentes.
    const _defaults=defaultUsers();
    data.users=data.users.map(u=>{
      if(String(u?.senha??'').length)return u;
      const d=_defaults.find(x=>(u?.id&&x.id===u.id)||(u?.login&&x.login===u.login));
      return d?{...u,senha:d.senha}:u;
    });
    data.logs=Array.isArray(data.logs)?data.logs:[];"""
          if s.count(old_load)!=1:
              raise SystemExit(f'Bloco load esperado 1x, encontrado {s.count(old_load)}x')
          s=s.replace(old_load,new_load,1)

          marker="""function mergeStatesForSync(localState,remoteState,remoteMeta={}){"""
          helper="""function mergeUsersPreserveLocalPasswords(localUsers,remoteUsers){
  const local=Array.isArray(localUsers)?localUsers:[];
  const remote=Array.isArray(remoteUsers)?remoteUsers:[];
  if(!remote.length)return local.length?local:defaultUsers();
  const defaults=defaultUsers();
  return remote.map(r=>{
    const l=local.find(x=>(r?.id&&x.id===r.id)||(r?.login&&x.login===r.login));
    const d=defaults.find(x=>(r?.id&&x.id===r.id)||(r?.login&&x.login===r.login));
    const senha=String(l?.senha??'').length?l.senha:(String(r?.senha??'').length?r.senha:(d?.senha||''));
    return senha?{...r,senha}:{...r};
  });
}
"""
          if s.count(marker)!=1:
              raise SystemExit(f'mergeStatesForSync esperado 1x, encontrado {s.count(marker)}x')
          s=s.replace(marker,helper+marker,1)

          old_users="""merged.users=Array.isArray(remoteState.users)&&remoteState.users.length?remoteState.users:(merged.users||defaultUsers());"""
          count=s.count(old_users)
          if count!=2:
              raise SystemExit(f'Atribuicao merged.users esperada 2x, encontrada {count}x')
          s=s.replace(old_users,"merged.users=mergeUsersPreserveLocalPasswords(merged.users,remoteState.users);",2)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        shell: bash
        run: |
          test -s backups/index_pre_fix_login_sync_2026-09-03.html
          grep -q "mergeUsersPreserveLocalPasswords" index.html
          grep -q "Recupera apenas credenciais padrão ausentes" index.html
          test "$(grep -o "mergeUsersPreserveLocalPasswords(merged.users,remoteState.users)" index.html | wc -l)" -eq 2
      - name: Gravar
        shell: bash
        run: |
          git config user.name "Portaria Primavera Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_fix_login_sync_2026-09-03.html
          git commit -m "fix: preservar senhas locais durante sincronizacao"
          git push origin main

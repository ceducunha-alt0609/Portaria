name: Refino alerta ambar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refino-alerta-ambar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_refino_alerta_ambar_2026-09-04.html
          cp sw.js backups/sw_pre_refino_alerta_ambar_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/refino_alerta_ambar.py
      - name: Validar
        run: |
          grep -q 'rgba(213,138,0,.14)' index.html
          grep -q 'rgba(240,184,68,.42)' index.html
          grep -q 'portaria-primavera-v1-0-21' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_refino_alerta_ambar_2026-09-04.html backups/sw_pre_refino_alerta_ambar_2026-09-04.js
          git commit -m "refine: diferenciar alerta de permanencia intermediaria"
          git push origin main

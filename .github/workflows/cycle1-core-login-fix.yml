name: Cycle 1 core login fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle1-core-login-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          mkdir -p backups
          cp index.html backups/index_pre_cycle1_login_2026-09-03.html
          cp sw.js backups/sw_pre_cycle1_login_2026-09-03.js
      - name: Aplicar correção
        run: python .github/scripts/cycle1_core_login_fix.py
      - name: Validar
        run: |
          grep -q "function mergeUsersPreservingPasswords" index.html
          grep -q "data.users=repairLocalUserPasswords" index.html
          grep -q "merged.users=mergeUsersPreservingPasswords" index.html
          grep -q "portaria-primavera-v1-0-5" sw.js
          ! grep -q "DEFAULT_LOCAL_PASSWORDS" sw.js
          grep -q "mobileHistoryShortcut" index.html
          grep -q "Consultar histórico de acessos" index.html
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_cycle1_login_2026-09-03.html backups/sw_pre_cycle1_login_2026-09-03.js
          git rm .github/scripts/cycle1_core_login_fix.py .github/workflows/cycle1-core-login-fix.yml
          git commit -m "fix: preservar credenciais no core de sincronizacao"
          git push origin main

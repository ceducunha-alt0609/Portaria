name: Inspect backup settings gdrive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-backup-settings-gdrive.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['function buildBackupPayload','function applyBackupData','function initial(){','function load()','function saveGDriveIntegrationConfig','function updateIntegrationStatus','function clearGDriveIntegrationConfig','function gdriveClientId','function gdriveApiKey']
          out=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  j=s.find('\nfunction ',i+10)
                  if j<0 or j>i+9000: j=i+9000
                  out.append(f'### {needle} @ {i}\n'+s[max(0,i-1200):j]+'\n')
                  start=i+len(needle)
          Path('backups/diagnostico_backup_settings_gdrive_2026-09-03.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/diagnostico_backup_settings_gdrive_2026-09-03.txt
          git commit -m "chore: registrar diagnostico de settings e backup do drive"
          git push origin main

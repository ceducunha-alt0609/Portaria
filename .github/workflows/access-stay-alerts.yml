name: Access stay alerts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-stay-alerts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_alerta_permanencia_2026-09-04.html
          cp sw.js backups/sw_pre_alerta_permanencia_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/access_stay_alerts.py
      - name: Validar
        run: |
          grep -q 'function accessStayAlert' index.html
          grep -q 'Permanência prolongada' index.html
          grep -q 'Verificar saída' index.html
          grep -q 'portaria-primavera-v1-0-19' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_alerta_permanencia_2026-09-04.html backups/sw_pre_alerta_permanencia_2026-09-04.js
          git commit -m "feat: destacar acessos com permanencia prolongada"
          git push origin main

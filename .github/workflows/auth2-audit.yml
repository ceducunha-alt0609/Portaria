name: Auth 2 audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth2-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar auditoria
        run: python .github/scripts/auth2_audit.py
      - name: Commit auditoria
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/auth2_audit.txt
          git commit -m "chore: registrar auditoria auth 2.0"
          git push origin main

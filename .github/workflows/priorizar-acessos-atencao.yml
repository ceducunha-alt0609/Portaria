name: Priorizar acessos atencao
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/priorizar-acessos-atencao.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_prioridade_acessos_2026-09-04.html
          cp sw.js backups/sw_pre_prioridade_acessos_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/priorizar_acessos_atencao.py
      - name: Validar
        run: |
          grep -q 'const accessPriority=a=>' index.html
          grep -q 'if(pb!==pa)return pb-pa' index.html
          grep -q 'portaria-primavera-v1-0-22' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_prioridade_acessos_2026-09-04.html backups/sw_pre_prioridade_acessos_2026-09-04.js
          git commit -m "feat: priorizar acessos que exigem atencao"
          git push origin main

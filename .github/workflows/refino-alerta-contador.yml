name: Refino alerta contador
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refino-alerta-contador.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backups
        run: |
          cp index.html backups/index_pre_refino_alerta_contador_2026-09-04.html
          cp sw.js backups/sw_pre_refino_alerta_contador_2026-09-04.js
      - name: Aplicar
        run: python .github/scripts/refino_alerta_contador.py
      - name: Validar
        run: |
          grep -q 'accessStayLine' index.html
          grep -q 'accessStayAlert inline' index.html
          grep -q 'portaria-primavera-v1-0-20' sw.js
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js backups/index_pre_refino_alerta_contador_2026-09-04.html backups/sw_pre_refino_alerta_contador_2026-09-04.js
          git commit -m "refine: alinhar alerta de permanencia ao contador"
          git push origin main

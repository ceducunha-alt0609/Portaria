name: Refine access quick filters visual
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-access-quick-filters-visual.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index.html backups/index_pre_refino_visual_filtros_rapidos_2026-09-03.html
      - run: python .github/scripts/refine_access_quick_filters_visual.py
      - run: |
          grep -q 'border-radius:10px' index.html
          grep -q 'min-width:112px' index.html
          grep -q 'gap:12px' index.html
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_refino_visual_filtros_rapidos_2026-09-03.html
          git commit -m "refactor: padronizar filtros rapidos do controle em andamento"
          git push origin main

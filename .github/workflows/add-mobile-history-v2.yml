name: Apply mobile history v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mobile-history-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup
        run: |
          mkdir -p backups
          cp index.html backups/index_pre_mobile_history_2026-09-03.html
      - name: Aplicar
        run: python .github/scripts/add_mobile_history.py
      - name: Validar
        run: |
          grep -q "mobileHistoryShortcut" index.html
          grep -q "Consultar histórico de acessos" index.html
          grep -q "onclick=\"openAccessHistory()\"" index.html
      - name: Commit
        run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_mobile_history_2026-09-03.html
          git rm .github/scripts/add_mobile_history.py .github/workflows/add-mobile-history.yml .github/workflows/add-mobile-history-v2.yml
          git commit -m "feat: adicionar atalho mobile para historico de acessos"
          git push origin main

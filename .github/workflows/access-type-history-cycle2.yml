name: Access type history cycle 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-type-history-cycle2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index.html backups/index_pre_tipo_acesso_historico_2026-09-03.html
      - run: python .github/scripts/access_type_history_cycle2.py
      - run: |
          grep -q 'function accessTypeLabel(a)' index.html
          grep -q 'id="histAccessType"' index.html
          grep -q '<th>Tipo</th>' index.html
          grep -q 'accessTypePill' index.html
      - run: |
          git config user.name "Portaria Primavera Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index_pre_tipo_acesso_historico_2026-09-03.html
          git commit -m "feat: exibir e filtrar visitante ou prestador nos acessos"
          git push origin main

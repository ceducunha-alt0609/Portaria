<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portaria Primavera — Teste Backup Real v151.10</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;max-width:min(94vw,620px);background:#0f6b4d;color:#fff;border:1px solid #c8a24a;border-radius:14px;padding:9px 12px;font-size:11px;font-weight:800;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none;white-space:pre-line}
#badge.err{background:#8f1025}
</style>
</head>
<body>
<iframe id="app" src="./index.html?ppdrive15110=1&cb=20260905j" title="Portaria Primavera v150 com teste de backup real v151.10"></iframe>
<div id="badge">Drive v151.10: carregando…</div>
<script>
(()=>{
 const KEY='pp_gdrive_oauth_client_id_v151';
 const FOLDER='Portaria Primavera';
 const frame=document.getElementById('app'),badge=document.getElementById('badge');
 function setBadge(msg,err=false){badge.textContent=msg;badge.classList.toggle('err',!!err);}
 function normalize(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase();}
 function short(v){v=String(v||'');return v?`${v.slice(0,14)}…${v.slice(-14)}`:'(vazio)';}
 function patchUi(w,d){
   const key=d.getElementById('gdriveApiKeyConfig');if(key){const wrap=key.closest('div');if(wrap)wrap.style.display='none';}
   d.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='API Key'){const wrap=l.closest('div');if(wrap)wrap.style.display='none';}});
   const id=String(w.localStorage.getItem(KEY)||'');
   const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');if(f)f.value=id;
   const st=d.getElementById('gdriveIntegrationStatus');if(st){st.className='integrationStatus warn';st.textContent=id?'OAuth v151 configurado':'OAuth v151 não configurado';}
 }
 function waitForOAuth(){
   return new Promise((resolve,reject)=>{
     let done=false;const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('Tempo esgotado aguardando autorização.'));}},120000);
     function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMsg);}
     function onMsg(ev){if(ev.origin!==location.origin)return;
       if(ev.data?.type==='pp:gdrive-oauth-token'){if(done)return;done=true;cleanup();resolve(ev.data);}
       else if(ev.data?.type==='pp:gdrive-oauth-error'){if(done)return;done=true;cleanup();reject(new Error(ev.data.message||'Falha no OAuth.'));}
     }
     window.addEventListener('message',onMsg);
     const pop=window.open('./gdrive-oauth-bridge-v1518.html?cb=20260905j','pp-gdrive-oauth-v15110','width=560,height=720');
     if(!pop){done=true;cleanup();reject(new Error('O navegador bloqueou a janela de autorização.'));}
   });
 }
 async function driveJson(url,token,opts={}){
   const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}});
   if(!r.ok){const t=await r.text();throw new Error('Drive API '+r.status+': '+t.slice(0,220));}
   return r.status===204?null:r.json();
 }
 async function ensureFolder(token){
   const q=`name='${FOLDER.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
   const list=await driveJson('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)&spaces=drive',token);
   if(list.files?.[0])return list.files[0].id;
   const made=await driveJson('https://www.googleapis.com/drive/v3/files?fields=id,name',token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER,mimeType:'application/vnd.google-apps.folder'})});
   return made.id;
 }
 async function uploadJson(token,folderId,name,obj){
   const boundary='pp15110_'+Math.random().toString(16).slice(2);
   const meta={name,parents:[folderId],mimeType:'application/json'};
   const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(obj)}\r\n--${boundary}--`;
   return driveJson('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,createdTime,size',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
 }
 async function readBack(token,id){
   const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
   if(!r.ok)throw new Error('Falha ao reler backup ('+r.status+')');
   return r.json();
 }
 async function runRealBackup(w,d){
   const id=String(w.localStorage.getItem(KEY)||'').trim();
   if(!id.endsWith('.apps.googleusercontent.com')){setBadge('Salve primeiro o OAuth Client ID v151.',true);return;}
   if(typeof w.buildBackupPayload!=='function'){
     setBadge('❌ O motor nativo buildBackupPayload() não ficou acessível nesta sessão. Nada foi enviado.',true);return;
   }
   setBadge('1/5 — Autorizando Google Drive…');
   try{
     const auth=await waitForOAuth(); const token=String(auth.token||'');
     setBadge('2/5 — Gerando backup REAL pelo motor nativo do Portaria…');
     const payload=w.buildBackupPayload('completo');
     if(!payload?._pp_backup||payload.tipo!=='completo'||!payload.checksum)throw new Error('Motor nativo retornou envelope inválido.');
     setBadge('3/5 — Localizando pasta Portaria Primavera…');
     const folderId=await ensureFolder(token);
     const stamp=new Date().toISOString().replace(/[:.]/g,'-');
     const name=`Portaria_Primavera_backup_completo_v15110_${stamp}.json`;
     setBadge('4/5 — Enviando backup completo ao Google Drive…\nArquivo: '+name);
     const file=await uploadJson(token,folderId,name,payload);
     const back=await readBack(token,file.id);
     if(!back?._pp_backup||back.checksum!==payload.checksum||back.tipo!=='completo')throw new Error('Arquivo foi criado, mas a conferência do envelope/checksum não bateu.');
     try{w.localStorage.setItem('pp_last_gdrive_backup_at',new Date().toISOString());w.refreshBackupCenterStatus?.();}catch(e){}
     const st=d.getElementById('gdriveIntegrationStatus');if(st){st.className='integrationStatus ok';st.textContent='Drive conectado';}
     setBadge(`✅ 5/5 — BACKUP REAL APROVADO\nPasta: ${FOLDER}\nArquivo: ${file.name}\nEnvelope: completo + checksum conferido\nStats: ${payload.stats?.unidades||0} unidades • ${payload.stats?.acessos||0} acessos • ${payload.stats?.logs||0} logs • ${payload.stats?.usuarios||0} usuários`);
   }catch(e){setBadge('❌ Teste de backup real interrompido: '+(e?.message||e),true);}
 }
 frame.addEventListener('load',()=>{
   try{
     const w=frame.contentWindow,d=frame.contentDocument;patchUi(w,d);
     const handler=(ev)=>{
       const btn=ev.target?.closest?.('button');if(!btn)return;const txt=normalize(btn.textContent);
       if(txt.includes('salvar integração')){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');const id=String(f?.value||'').trim();if(!id.endsWith('.apps.googleusercontent.com')){setBadge('OAuth Client ID inválido.',true);return;}w.localStorage.setItem(KEY,id);patchUi(w,d);setBadge('✅ OAuth v151 salvo: '+short(id));return;}
       if(txt.includes('testar configuração')){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();runRealBackup(w,d);}
     };
     d.addEventListener('click',handler,true);
     setBadge('Drive v151.10 pronto.\nEste teste usa buildBackupPayload("completo") do próprio Portaria e grava um backup REAL no Drive.');
   }catch(e){setBadge('Falha ao iniciar v151.10: '+(e?.message||e),true);}
 });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portaria Primavera — Teste Drive v151.5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;max-width:min(94vw,520px);background:#0f6b4d;color:#fff;border:1px solid #c8a24a;border-radius:14px;padding:9px 12px;font-size:11px;font-weight:800;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none;white-space:pre-line}
#badge.err{background:#8f1025}
</style>
</head>
<body>
<iframe id="app" src="./index.html?ppdrive1515=1&cb=20260905e" title="Portaria Primavera v150 com Drive v151.5"></iframe>
<div id="badge">Drive v151.5: carregando…</div>
<script>
(()=>{
 const frame=document.getElementById('app'),badge=document.getElementById('badge');
 let accessToken='';
 function setBadge(msg,err=false){badge.textContent=msg;badge.classList.toggle('err',!!err);}
 function normalize(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase();}
 function short(v){v=String(v||'');return v?`${v.slice(0,14)}…${v.slice(-14)}`:'(vazio)';}
 function patchUi(w,d){
   const key=d.getElementById('gdriveApiKeyConfig');
   if(key){const wrap=key.closest('div');if(wrap)wrap.style.display='none';}
   d.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='API Key'){const wrap=l.closest('div');if(wrap)wrap.style.display='none';}});
   const st=d.getElementById('gdriveIntegrationStatus');
   const id=String(w.localStorage.getItem('pp_gdrive_client_id')||'');
   const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');
   if(f&&id)f.value=id;
   if(st){st.className='integrationStatus '+(id?'warn':'warn');st.textContent=id?'OAuth Client ID configurado':'Não configurado';}
 }
 function setLegacyToken(w,token){
   try{w.eval('_gdriveToken = '+JSON.stringify(token||null));}catch(e){}
   w._gdriveToken=token||null;
 }
 function waitForOAuth(w){
   return new Promise((resolve,reject)=>{
     let done=false;
     const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('Tempo esgotado aguardando autorização.'));}},90000);
     function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMsg);}
     function onMsg(ev){
       if(ev.origin!==location.origin)return;
       if(ev.data?.type==='pp:gdrive-oauth-token'){
         if(done)return;done=true;cleanup();resolve(ev.data);
       }else if(ev.data?.type==='pp:gdrive-oauth-error'){
         if(done)return;done=true;cleanup();reject(new Error(ev.data.message||'Falha no OAuth.'));
       }
     }
     window.addEventListener('message',onMsg);
     const pop=window.open('./gdrive-oauth-bridge-v151.html?cb=20260905e','pp-gdrive-oauth','width=560,height=720');
     if(!pop){done=true;cleanup();reject(new Error('O navegador bloqueou a janela de autorização.'));}
   });
 }
 async function testDrive(w,d){
   const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');
   const id=String(f?.value||w.localStorage.getItem('pp_gdrive_client_id')||'').trim();
   if(!id.includes('.apps.googleusercontent.com')){setBadge('Informe e salve primeiro o OAuth Client ID.',true);return;}
   w.localStorage.setItem('pp_gdrive_client_id',id);
   setBadge('Abrindo autorização do Google em janela própria…');
   try{
     const auth=await waitForOAuth(w);
     accessToken=String(auth.token||'');
     setLegacyToken(w,accessToken);
     setBadge('OAuth autorizado. Testando Google Drive API…');
     const r=await fetch('https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id,name)',{headers:{Authorization:'Bearer '+accessToken},cache:'no-store'});
     if(!r.ok)throw new Error('Drive API respondeu HTTP '+r.status);
     await r.json();
     try{w.gdriveUpdateUI?.(true);w.refreshBackupCenterStatus?.();}catch(e){}
     const st=d.getElementById('gdriveIntegrationStatus');if(st){st.className='integrationStatus ok';st.textContent='Drive conectado';}
     setBadge('✅ OAuth autorizado e Google Drive API respondeu corretamente.');
   }catch(e){setLegacyToken(w,'');setBadge('❌ '+(e?.message||e),true);}
 }
 frame.addEventListener('load',()=>{
   try{
     const w=frame.contentWindow,d=frame.contentDocument;
     patchUi(w,d);
     const handler=(ev)=>{
       const btn=ev.target?.closest?.('button');if(!btn)return;
       const txt=normalize(btn.textContent);
       if(txt.includes('salvar integração')){
         ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
         const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');
         const id=String(f?.value||'').trim();
         if(!id.includes('.apps.googleusercontent.com')){setBadge('OAuth Client ID inválido.',true);return;}
         w.localStorage.setItem('pp_gdrive_client_id',id);
         try{w.localStorage.removeItem('pp_gdrive_api_key');}catch(e){}
         patchUi(w,d);
         setBadge('✅ OAuth Client ID salvo: '+short(id));
         return;
       }
       if(txt.includes('testar configuração')){
         ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
         testDrive(w,d);
       }
     };
     d.addEventListener('click',handler,true);
     setBadge('Drive v151.5 pronto. Salvar = local direto; Testar = OAuth top-level.');
   }catch(e){setBadge('Falha ao iniciar teste v151.5: '+(e?.message||e),true);}
 });
})();
</script>
</body>
</html>

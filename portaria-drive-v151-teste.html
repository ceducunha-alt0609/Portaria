<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portaria Primavera — Teste Drive v151</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;background:#0d1b2a;color:#fff;border:1px solid #c8a24a;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none}
#badge.ok{background:#0f6b4d}#badge.err{background:#8f1025}
</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Portaria Primavera v150 com adapter Drive v151"></iframe>
<div id="badge">Drive v151: carregando…</div>
<script>
(()=>{
 const frame=document.getElementById('app'), badge=document.getElementById('badge');
 function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src+'?v=151b';s.onload=resolve;s.onerror=reject;doc.head.appendChild(s);});}
 function normalize(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase();}
 function wireDriveButtons(w,d){
   const buttons=[...d.querySelectorAll('button')];
   let testWired=false, saveWired=false;
   for(const btn of buttons){
     const txt=normalize(btn.textContent);
     if(txt.includes('testar configuração')){
       btn.onclick=(ev)=>{ev?.preventDefault?.();ev?.stopPropagation?.();w.PortariaGDriveAdapter?.test?.();return false;};
       testWired=true;
     }
     if(txt.includes('salvar integração')){
       btn.onclick=(ev)=>{ev?.preventDefault?.();ev?.stopPropagation?.();w.PortariaGDriveAdapter?.refresh?.();w.saveGDriveIntegrationConfig?.();return false;};
       saveWired=true;
     }
   }
   d.addEventListener('click',(ev)=>{
     const btn=ev.target?.closest?.('button'); if(!btn)return;
     const txt=normalize(btn.textContent);
     if(txt.includes('testar configuração')){
       ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
       w.PortariaGDriveAdapter?.test?.();
     }
   },true);
   return {testWired,saveWired};
 }
 frame.addEventListener('load',async()=>{
   try{
     const w=frame.contentWindow, d=frame.contentDocument;
     await loadScript(d,'./gdrive-oauth-v151.js');
     await loadScript(d,'./gdrive-adapter-v151.js');
     const wired=wireDriveButtons(w,d);
     badge.textContent=wired.testWired?'Drive v151: adapter ativo + botão ligado':'Drive v151: adapter ativo; botão pendente';
     badge.className=wired.testWired?'ok':'err';
     const observer=new MutationObserver(()=>{const r=wireDriveButtons(w,d);if(r.testWired){badge.textContent='Drive v151: adapter ativo + botão ligado';badge.className='ok';}});
     observer.observe(d.documentElement,{childList:true,subtree:true});
     w.console?.info?.('[Portaria] Sandbox Drive OAuth v151 ativo — botão Testar configuração roteado explicitamente ao adapter.');
   }catch(e){badge.textContent='Drive v151: falha ao carregar';badge.className='err';console.error(e);}
 });
})();
</script>
</body>
</html>

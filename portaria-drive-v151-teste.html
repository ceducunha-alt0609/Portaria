<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portaria Primavera — Teste Drive v151</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;background:#0d1b2a;color:#fff;border:1px solid #c8a24a;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none}
#badge.ok{background:#0f6b4d}#badge.err{background:#8f1025}
</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Portaria Primavera v150 com adapter Drive v151"></iframe>
<div id="badge">Drive v151: carregando…</div>
<script>
(()=>{
 const frame=document.getElementById('app'), badge=document.getElementById('badge');
 function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src+'?v=151';s.onload=resolve;s.onerror=reject;doc.head.appendChild(s);});}
 frame.addEventListener('load',async()=>{
   try{
     const w=frame.contentWindow, d=frame.contentDocument;
     await loadScript(d,'./gdrive-oauth-v151.js');
     await loadScript(d,'./gdrive-adapter-v151.js');
     badge.textContent='Drive v151: adapter ativo'; badge.className='ok';
     w.console?.info?.('[Portaria] Sandbox Drive OAuth v151 ativo — v150 original não alterada.');
   }catch(e){badge.textContent='Drive v151: falha ao carregar';badge.className='err';console.error(e);}
 });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portaria Primavera — Teste Drive v151</title>
<style>body{font-family:system-ui;padding:24px;background:#0d1b2a;color:#fff}#boot{max-width:760px;margin:10vh auto;background:#13263a;border:1px solid #c8a24a;border-radius:18px;padding:24px}</style>
</head>
<body>
<div id="boot"><h2>Portaria Primavera — preparando teste Drive v151…</h2><p>Carregando a v150 em modo de teste isolado, sem iframe.</p></div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html?ppv151='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Falha ao carregar index.html: HTTP '+r.status);
    let html=await r.text();
    const inject=`
<script src="./gdrive-oauth-v151.js?v=151c"><\/script>
<script src="./gdrive-adapter-v151.js?v=151c"><\/script>
<script>
(()=>{
  const normalize=s=>String(s||'').replace(/\\s+/g,' ').trim().toLowerCase();
  const badge=document.createElement('div');
  badge.id='ppDrive151Badge';
  badge.textContent='Drive v151: modo top-level ativo';
  badge.style.cssText='position:fixed;right:10px;bottom:10px;z-index:2147483647;background:#0f6b4d;color:white;border:1px solid #c8a24a;border-radius:999px;padding:7px 11px;font:800 11px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none';
  document.body.appendChild(badge);

  document.addEventListener('click',ev=>{
    const btn=ev.target?.closest?.('button'); if(!btn)return;
    const txt=normalize(btn.textContent);
    if(txt.includes('testar configuração')){
      ev.preventDefault(); ev.stopPropagation(); ev.stopImmediatePropagation();
      window.PortariaGDriveAdapter?.test?.();
      return false;
    }
    if(txt.includes('salvar integração')){
      ev.preventDefault(); ev.stopPropagation(); ev.stopImmediatePropagation();
      window.saveGDriveIntegrationConfig?.();
      return false;
    }
  },true);

  console.info('[Portaria] Sandbox Drive OAuth v151 em top-level — sem iframe.');
})();
<\/script>`;
    if(html.includes('</body>')) html=html.replace('</body>',inject+'\n</body>');
    else html+=inject;
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<h2>Falha ao preparar teste</h2><pre>'+String(e)+'</pre>';
    console.error(e);
  }
})();
</script>
</body>
</html>

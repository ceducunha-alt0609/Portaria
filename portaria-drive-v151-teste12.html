<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Portaria Primavera — Teste Retenção v151.12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}iframe{border:0;width:100%;height:100%;display:block;background:#fff}#badge{position:fixed;right:10px;bottom:10px;z-index:999999;max-width:min(94vw,650px);background:#0f6b4d;color:#fff;border:1px solid #c8a24a;border-radius:14px;padding:10px 13px;font-size:11px;font-weight:800;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none;white-space:pre-line}#badge.err{background:#8f1025}</style></head><body><iframe id="app" src="./index.html?ppdrive15112=1&cb=20260905m"></iframe><div id="badge">Drive v151.12: carregando…</div><script>(()=>{const KEY='pp_gdrive_oauth_client_id_v151',FOLDER='Portaria Primavera',PREFIX='PP_RETENCAO_TESTE_V15112_';const frame=document.getElementById('app'),badge=document.getElementById('badge');function setBadge(m,e=false){badge.textContent=m;badge.classList.toggle('err',!!e)}function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function oauth(){return new Promise((resolve,reject)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('Tempo esgotado no OAuth.'))}},120000);function cleanup(){clearTimeout(t);window.removeEventListener('message',onmsg)}function onmsg(ev){if(ev.origin!==location.origin)return;if(ev.data?.type==='pp:gdrive-oauth-token'){if(done)return;done=true;cleanup();resolve(ev.data.token)}else if(ev.data?.type==='pp:gdrive-oauth-error'){if(done)return;done=true;cleanup();reject(new Error(ev.data.message||'Falha OAuth'))}}window.addEventListener('message',onmsg);const p=window.open('./gdrive-oauth-bridge-v1518.html?cb=20260905m','pp-gdrive-oauth-v15112','width=560,height=720');if(!p){done=true;cleanup();reject(new Error('Popup bloqueado.'))}})}async function api(url,token,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}});if(!r.ok){const tx=await r.text().catch(()=>"");throw new Error('HTTP '+r.status+(tx?' — '+tx.slice(0,160):''))}if(r.status===204)return null;const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text()}async function folderId(token){const q=`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;const j=await api('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&fields=files(id,name)&pageSize=10',token);if(j.files?.length)return j.files[0].id;throw new Error('Pasta Portaria Primavera não encontrada.')}async function listFolder(token,fid){const q=`'${fid}' in parents and trashed=false`;const j=await api('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&orderBy=createdTime desc&fields=files(id,name,createdTime,size,mimeType)&pageSize=100',token);return j.files||[]}async function uploadTemp(token,fid,n){const stamp=new Date().toISOString().replace(/[:.]/g,'-');const name=`${PREFIX}${String(n).padStart(2,'0')}_${stamp}.json`;const boundary='pp15112_'+Math.random().toString(36).slice(2);const meta={name,mimeType:'application/json',parents:[fid]};const body=JSON.stringify({pp_test:true,tipo:'retencao',versao:'151.12',ordem:n,gerado_em:new Date().toISOString()});const multipart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,createdTime',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multipart})}async function removeFile(token,id){await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id),token,{method:'DELETE'})}async function run(w,d){try{setBadge('1/6 — Autorizando Google Drive…');const token=await oauth();try{w.eval('_gdriveToken = '+JSON.stringify(token))}catch(e){}w._gdriveToken=token;setBadge('2/6 — Localizando pasta e protegendo backups reais…');const fid=await folderId(token);let before=await listFolder(token,fid);const realBefore=before.filter(f=>/^Portaria_Primavera_backup_/.test(f.name));const realIds=new Set(realBefore.map(f=>f.id));const oldTemps=before.filter(f=>f.name.startsWith(PREFIX));for(const f of oldTemps)await removeFile(token,f.id);setBadge('3/6 — Criando 7 arquivos temporários de retenção…');for(let i=1;i<=7;i++){await uploadTemp(token,fid,i);await sleep(180)}setBadge('4/6 — Aplicando limite de 5 somente aos arquivos temporários…');let mid=await listFolder(token,fid);let temps=mid.filter(f=>f.name.startsWith(PREFIX)).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime)));if(temps.length!==7)throw new Error('Esperados 7 temporários antes da retenção; encontrados '+temps.length);const excess=temps.slice(5);for(const f of excess)await removeFile(token,f.id);setBadge('5/6 — Conferindo retenção e integridade dos backups reais…');let after=await listFolder(token,fid);const tempsAfter=after.filter(f=>f.name.startsWith(PREFIX)).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime)));const realAfter=after.filter(f=>/^Portaria_Primavera_backup_/.test(f.name));const realAfterIds=new Set(realAfter.map(f=>f.id));if(tempsAfter.length!==5)throw new Error('Retenção falhou: ficaram '+tempsAfter.length+' temporários em vez de 5.');for(const id of realIds)if(!realAfterIds.has(id))throw new Error('Proteção falhou: um backup real anterior não foi preservado.');if(realAfter.length<realBefore.length)throw new Error('Quantidade de backups reais diminuiu durante o teste.');setBadge(`✅ 6/6 — RETENÇÃO APROVADA\nPasta: ${FOLDER}\nTemporários criados: 7\nTemporários removidos: ${excess.length}\nTemporários mantidos: ${tempsAfter.length}\nBackups reais antes: ${realBefore.length}\nBackups reais depois: ${realAfter.length}\nBackups reais tocados/removidos: 0\nRegra validada: manter somente os 5 mais recentes.`);try{w.gdriveUpdateUI?.(true)}catch(e){}}catch(e){setBadge('❌ '+(e?.message||e),true)}}frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;const key=d.getElementById('gdriveApiKeyConfig');if(key){const wrap=key.closest('div');if(wrap)wrap.style.display='none'}d.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='API Key'){const wrap=l.closest('div');if(wrap)wrap.style.display='none'}});const id=String(w.localStorage.getItem(KEY)||'');const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');if(f)f.value=id;const st=d.getElementById('gdriveIntegrationStatus');if(st){st.className='integrationStatus warn';st.textContent=id?'OAuth v151 configurado':'OAuth v151 não configurado'}d.addEventListener('click',ev=>{const b=ev.target?.closest?.('button');if(!b)return;const txt=norm(b.textContent);if(txt.includes('testar configuração')){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();run(w,d)}},true);setBadge('Drive v151.12 pronto. Clique em Testar configuração para validar retenção com arquivos temporários; backups reais serão apenas conferidos, nunca apagados.')}catch(e){setBadge('Falha ao iniciar v151.12: '+(e?.message||e),true)}})})();</script></body></html>

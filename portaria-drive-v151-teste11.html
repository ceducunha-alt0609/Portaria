<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Portaria Primavera — Teste Backups v151.11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}iframe{border:0;width:100%;height:100%;display:block;background:#fff}#badge{position:fixed;right:10px;bottom:10px;z-index:999999;max-width:min(94vw,620px);background:#0f6b4d;color:#fff;border:1px solid #c8a24a;border-radius:14px;padding:10px 13px;font-size:11px;font-weight:800;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.24);pointer-events:none;white-space:pre-line}#badge.err{background:#8f1025}</style></head><body><iframe id="app" src="./index.html?ppdrive15111=1&cb=20260905k"></iframe><div id="badge">Drive v151.11: carregando…</div><script>(()=>{const KEY='pp_gdrive_oauth_client_id_v151',FOLDER='Portaria Primavera';const frame=document.getElementById('app'),badge=document.getElementById('badge');function setBadge(m,e=false){badge.textContent=m;badge.classList.toggle('err',!!e)}function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}function esc(s){return String(s).replace(/'/g,"\\'")}async function oauth(){return new Promise((resolve,reject)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('Tempo esgotado no OAuth.'))}},120000);function cleanup(){clearTimeout(t);window.removeEventListener('message',onmsg)}function onmsg(ev){if(ev.origin!==location.origin)return;if(ev.data?.type==='pp:gdrive-oauth-token'){if(done)return;done=true;cleanup();resolve(ev.data.token)}else if(ev.data?.type==='pp:gdrive-oauth-error'){if(done)return;done=true;cleanup();reject(new Error(ev.data.message||'Falha OAuth'))}}window.addEventListener('message',onmsg);const p=window.open('./gdrive-oauth-bridge-v1518.html?cb=20260905k','pp-gdrive-oauth-v15111','width=560,height=720');if(!p){done=true;cleanup();reject(new Error('Popup bloqueado.'))}})}async function jfetch(url,token,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}});if(!r.ok)throw new Error('HTTP '+r.status+' em '+url);return r.json()}async function folderId(token){const q=`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;let j=await jfetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&fields=files(id,name,createdTime)&pageSize=10',token);if(j.files?.length)return j.files[0].id;throw new Error('Pasta Portaria Primavera não encontrada.')}async function run(w,d){try{setBadge('1/4 — Autorizando Google Drive…');const token=await oauth();try{w.eval('_gdriveToken = '+JSON.stringify(token))}catch(e){}w._gdriveToken=token;setBadge('2/4 — Localizando pasta e listando backups…');const fid=await folderId(token);const q=`'${fid}' in parents and trashed=false`;const list=await jfetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&orderBy=createdTime desc&fields=files(id,name,createdTime,size,mimeType)&pageSize=100',token);const files=(list.files||[]).filter(f=>/Portaria_Primavera_backup_completo_v15110_|Portaria_Primavera_backup_/.test(f.name));if(!files.length)throw new Error('Nenhum backup real encontrado na pasta.');setBadge('3/4 — Lendo backup mais recente sem restaurar…');const latest=files[0];const raw=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(latest.id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(!raw.ok)throw new Error('Falha ao ler backup HTTP '+raw.status);const parsed=await raw.json();if(!parsed?._pp_backup)throw new Error('Arquivo mais recente não é envelope oficial do Portaria.');let valid=true,msg='';try{if(typeof w.validateBackup==='function'){const v=w.validateBackup(parsed);valid=!!v?.ok;msg=v?.msg||''}else if(typeof w.crc32==='function'){valid=w.crc32(JSON.stringify(parsed.dados))===parsed.checksum}else valid=!!parsed.checksum}catch(e){valid=false;msg=e.message}if(!valid)throw new Error('Validação/checksum falhou. '+msg);const max=Number(w.GDRIVE_MAX_BACKUPS||5);const over=Math.max(0,files.length-max);setBadge(`✅ 4/4 — LISTAGEM E LEITURA APROVADAS\nPasta: ${FOLDER}\nBackups reais encontrados: ${files.length}\nLimite esperado: ${max}\nExcedentes atuais: ${over}\nMais recente: ${latest.name}\nEnvelope/checksum: OK\nNenhum dado foi restaurado.`);try{w.gdriveUpdateUI?.(true)}catch(e){}}catch(e){setBadge('❌ '+(e?.message||e),true)}}frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;const key=d.getElementById('gdriveApiKeyConfig');if(key){const wrap=key.closest('div');if(wrap)wrap.style.display='none'}d.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='API Key'){const wrap=l.closest('div');if(wrap)wrap.style.display='none'}});const id=String(w.localStorage.getItem(KEY)||'');const f=d.getElementById('gdriveClientIdConfig')||d.getElementById('gdriveClientId');if(f)f.value=id;const st=d.getElementById('gdriveIntegrationStatus');if(st){st.className='integrationStatus warn';st.textContent=id?'OAuth v151 configurado':'OAuth v151 não configurado'}d.addEventListener('click',ev=>{const b=ev.target?.closest?.('button');if(!b)return;const txt=norm(b.textContent);if(txt.includes('testar configuração')){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();run(w,d)}},true);setBadge('Drive v151.11 pronto. Clique em Testar configuração para listar e validar backups sem restaurar.')}catch(e){setBadge('Falha ao iniciar v151.11: '+(e?.message||e),true)}})})();</script></body></html>
